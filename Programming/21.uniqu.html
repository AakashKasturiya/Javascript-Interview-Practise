<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Unique Character of a String</title>
  </head>
  <body>
    <h2>First Unique Character of a String</h2>
    <script>
      function firstUniqueCharacter(str) {
        // Create an object to store the frequency of each character
        let charCount = {};

        // Count the frequency of each character
        for (let char of str) {
          charCount[char] = (charCount[char] || 0) + 1;
        }

        // Find the first character with a count of 1 (unique character)
         for (let i = 0; i < str.length; i++) {
            console.log(charCount[str[i]]);
            if (charCount[str[i]] === 1) {
              return str[i];
           }
         }
       
        // If no unique character is found, return null
        return null;
      }

      // Example usage
      console.log(firstUniqueCharacter("swiss")); // 'w'
      console.log(firstUniqueCharacter("aabbcc")); // null
    </script>
  </body>
</html>
