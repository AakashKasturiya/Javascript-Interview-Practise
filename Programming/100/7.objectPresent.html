<!DOCTYPE html>

<body>
    <h1>How to check if an object is present in an Array or not?</h1>

    <script>
       const obj1 = {id:1, name: "Aakash"};
       const obj2 = {id:2, name: "Vikas"};
       const obj3 = {id:3, name: "Raju"};

       const array = [obj1, obj2];

       console.log(array.includes(obj1));
       console.log(array.includes(obj3));
    </script>
</body>
