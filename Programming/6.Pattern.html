    <h1>Program to Printing Star and Number Patterns</h1>
    <p>Diamond Shape in Javascript</p>
    
    <script>
    /* 1. Program to Printing Star and Number Patterns Right Triangle */

    document.write("1. Right Triangle" + "<br><br>");

    for(let i = 1; i<=6; i++){
        for(let j=1; j<=i; j++){
            document.write("* &nbsp;&nbsp;");
        }
        document.write("</br>")
    }

    document.write("2. Pyramidand Shape"  + "<br><br>");

    for (let i = 1; i <= 6; i++) {
            for(k=1; k<=6-i; k++){
              document.write("&nbsp;&nbsp;");
            }
            for (let j = 1; j <= i; j++) {
                document.write("* &nbsp;&nbsp;");
            }
            document.write("</br>")
        }


     document.write("3. Diamond Shape"  + "<br><br>");

     for (let i = 1; i <= 6; i++) {
            for(k=1; k<=6-i; k++){
              document.write("&nbsp;&nbsp;");
            }
            for (let j = 1; j <= i; j++) {
                document.write("* &nbsp;&nbsp;");
            }
            document.write("</br>")
        } 
        for (let i = 1; i <= 6; i++) {
            for(k=1; k<=i; k++){
              document.write("&nbsp;&nbsp;");
            }
            for (let j = 1; j <= 6-i; j++) {
                document.write("* &nbsp;&nbsp;");
            }
            document.write("</br>")
        }



    </script>
