<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armstrong Number</title>
  </head>
  <body>
    <h1>Armstrong Number</h1>
    <script>
      function isArmstrongNumber(num) {
        let sum = 0;
        let originalNum = num;
        let digits = num.toString().length; // Find the number of digits

        while (num > 0) {
          let rem = num % 10;
          sum += rem ** digits; // Use the number of digits to calculate the power
          num = parseInt(num / 10);
        }

        if (sum === originalNum) {
          console.log(originalNum + " is an Armstrong number.");
        } else {
          console.log(originalNum + " is not an Armstrong number.");
        }
      }

      const number = Number(prompt("Enter the number:"));
      isArmstrongNumber(number);
    </script>
  </body>
</html>
