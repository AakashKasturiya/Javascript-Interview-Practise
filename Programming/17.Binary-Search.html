<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performing binary search</title>
  </head>
  <body>
    <h3>Performing binary search</h3>
    <script>
      function binarySearch(arr, target) {
        let left = 0;
        let right = arr.length - 1;

        while (left <= right) {
          // Find the middle index
          let middle = Math.floor((left + right) / 2);

          // Check if the target is at the middle
          if (arr[middle] === target) {
            return middle; // Target found, return its index
          }

          // If the target is smaller, narrow search to the left half
          if (arr[middle] > target) {
            right = middle - 1;
          } else {
            // If the target is larger, narrow search to the right half
            left = middle + 1;
          }
        }

        return -1; // Target not found, return -1
      }

      // Example usage:
      const arr = [1, 3, 5, 7, 9, 11, 13, 15, 17];
      const target = 9;
      const result = binarySearch(arr, target);

      if (result !== -1) {
        console.log(`Target found at index: ${result}`);
      } else {
        console.log("Target not found.");
      }
    </script>
  </body>
</html>
