<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Call</title>
    <style>
        .card-container {
            display: flex;
            align-content: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
            gap: 8px;

        }

        .card-item {
            width: 30%;
            border: 1px solid #eee;
            border-radius: 12px;
            height: 300px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item img {
            width: 100%;
            height: 250px;
        }
    </style>
</head>

<body>
    <div class="card-container">
        <div class="card-item">
            <img src="" alt="" class="card-img" />
            <h6></h6>
        </div>
    </div>
    <script>
        const fetchData = async () => {
            const res = await fetch('https://dummyjson.com/products');
            const json = await res.json();
            console.log(json.products);

            // Now that data is fetched, you can access it
            let cardContainer = document.querySelector('.card-container');
            cardContainer.innerHTML = json.products.map((e) => {
                return `<div key="${e.id}" class="card-item">
                         <img src="${e.thumbnail}"/>
                         <h6>${e.title}</h6>
                    </div>`;
            }).join(''); // join to concatenate all the divs into a single string
        }

        fetchData();
    </script>

</body>

</html>
