<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Using an Adjacency Matrix</title>
</head>

<body>
    <h1>2. Using an Adjacency Matrix</h1>
    <script>
        class GraphMatrix {
            constructor(size) {
                this.size = size;
                this.matrix = Array(size).fill(null).map(() => Array(size).fill(0));
            }

            addEdge(v1, v2) {
                this.matrix[v1][v2] = 1;
                this.matrix[v2][v1] = 1; // Remove for a directed graph
            }

            display() {
                console.log(this.matrix);
            }
        }

        // Example Usage
        const graphM = new GraphMatrix(3);
        graphM.addEdge(0, 1);
        graphM.addEdge(1, 2);
        graphM.display();

    </script>
</body>

</html>
