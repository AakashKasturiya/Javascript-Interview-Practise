<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.Adjacency-List</title>
</head>
<body>
    <h1>Graph Implementation in JavaScript</h1>
    <p>The two most common ways to represent a graph in JavaScript are:</p>
    <h3>1. Using an Adjacency List (Most Common)</h3>
    <script>
        class Graph {
            constructor() {
                this.adjacencyList = {};
            }

            addVertex(vertex) {
                if (!this.adjacencyList[vertex]) {
                    this.adjacencyList[vertex] = [];
                }
            }

            addEdge(vertex1, vertex2) {
                this.adjacencyList[vertex1].push(vertex2);
                this.adjacencyList[vertex2].push(vertex1); // Remove for a directed graph
            }

            removeEdge(vertex1, vertex2) {
                this.adjacencyList[vertex1] = this.adjacencyList[vertex1].filter(v => v !== vertex2);
                this.adjacencyList[vertex2] = this.adjacencyList[vertex2].filter(v => v !== vertex1);
            }

            removeVertex(vertex) {
                while (this.adjacencyList[vertex].length) {
                    const adjacentVertex = this.adjacencyList[vertex].pop();
                    this.removeEdge(vertex, adjacentVertex);
                }
                delete this.adjacencyList[vertex];
            }

            display() {
                console.log(this.adjacencyList);
            }
        }

        // Example Usage
        const graph = new Graph();
        graph.addVertex('A');
        graph.addVertex('B');
        graph.addVertex('C');
        graph.addEdge('A', 'B');
        graph.addEdge('A', 'C');
        graph.display();

    </script>
</body>

</html>
