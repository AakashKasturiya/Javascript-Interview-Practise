<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Removing Spaces in String</title>
  </head>
  <body>
    <h2>Removing Spaces in String</h2>
    <script>
      let str = "Hello World! How are you?";
      let result = str.replace(/\s+/g, ""); // This will remove all spaces
      console.log(result); // Output: "HelloWorld!Howareyou?"

      let str1 = "   Hello World!   ";
      let result1 = str1.trim(); // This removes spaces from the beginning and end
      console.log(result1); // Output: "Hello World!"

      /*without use build-in methods*/
      
      function removeSpaces(string){
        let result = "";

        for(let i = 0; i < string.length; i++){
            if(string[i] !== " "){
                result += string[i];
            }
        }

        return result;
      }
      
      let str2 = "Hello World! How are you?";
      let result2 = removeSpaces(str2);
      console.log(result2); // Output: "HelloWorld!Howareyou?"

    </script>
  </body>
</html>
