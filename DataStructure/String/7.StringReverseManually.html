<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* Reverse String */
        
      let str = "hello";
      let reversedStr = "";
      for (let i = str.length - 1; i >= 0; i--) {
        reversedStr += str[i];
      }
      console.log(reversedStr); // Output: "olleh"
    </script>
  </body>
</html>
