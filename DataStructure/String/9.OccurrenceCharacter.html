<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occurrence Character</title>
</head>
<body>
    <h1>How to Check the No of Occurrence of Character in String</h1>
    <script>
        function countOccurrences(str, char) {
            let count = 0;
            for (let i = 0; i < str.length; i++) {
                if (str[i] === char) count++;
            }
            return count;
        }

        console.log(countOccurrences("hello world", "l")); // Output: 3
    </script>
</body>
</html>
