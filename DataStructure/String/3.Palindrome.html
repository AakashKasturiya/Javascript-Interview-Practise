<!DOCTYPE html>

    <title>Palindrome</title>
  </head>
  <body>
    <h1>Palindrome</h1>

    <script>
       
      /* Same code working on the integer (*convert to number from string only )and string */ 
      function isPalindrome(str) {
        let newString = "";
        // Reverse the string
        for (let i = str.length - 1; i >= 0; i--) {
          newString += str[i];
        }

        console.log("Reversed string: ", newString);
        if (newString === str) {
          console.log("Palindrome");
        } else {
          console.log("is not Palindrome");
        }
      }

      // In browser, this should work fine:

    </script>
  </body>
