<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Queue</title>
</head>

<body>
    <script>
        class CircularQueue {
            constructor(size) {
                this.size = size; // Maximum size of the queue
                this.queue = new Array(size); // Array to store queue elements
                this.front = -1; // Points to the front element
                this.rear = -1; // Points to the last element
            }

            // Add an element to the queue
            enqueue(element) {
                if (this.isFull()) {
                    console.log("Queue is full");
                    return;
                }

                if (this.front === -1) {
                    this.front = 0; // First element to be added
                }
                this.rear = (this.rear + 1) % this.size; // Wrap around if needed
                this.queue[this.rear] = element;
                console.log(`${element} enqueued to the queue`);
            }

            // Remove an element from the queue
            dequeue() {
                if (this.isEmpty()) {
                    console.log("Queue is empty");
                    return;
                }

                const removedElement = this.queue[this.front];
                if (this.front === this.rear) {
                    // If only one element was in the queue
                    this.front = this.rear = -1;
                } else {
                    this.front = (this.front + 1) % this.size; // Wrap around if needed
                }
                return removedElement;
            }

            // View the front element
            peek() {
                if (this.isEmpty()) {
                    console.log("Queue is empty");
                    return;
                }
                return this.queue[this.front];
            }

            // Check if the queue is empty
            isEmpty() {
                return this.front === -1;
            }

            // Check if the queue is full
            isFull() {
                return (this.rear + 1) % this.size === this.front;
            }

            // Get the size of the queue
            size() {
                if (this.isEmpty()) return 0;
                return (this.rear - this.front + 1 + this.size) % this.size;
            }
        }


        const cq = new CircularQueue(5); // Create a queue of size 5

        cq.enqueue(10);
        cq.enqueue(20);
        cq.enqueue(30);
        cq.enqueue(40);
        cq.enqueue(50);

        console.log(cq.dequeue()); // Removes 10
        console.log(cq.peek()); // 20 (front of the queue)

        cq.enqueue(60); // Add 60 to the queue
        console.log(cq.dequeue()); // Removes 20

        console.log(cq.size()); // Returns 3 (remaining elements in the queue)

    </script>
</body>

</html>
