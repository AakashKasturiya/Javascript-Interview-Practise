<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stack Operation</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      h3.title {
        font-size: 32px;
        text-align: center;
        padding: 20px;
        font-weight: 600;
      }
      .wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      input#inputField {
        padding: 10px;
        width: 70%;
        border-radius: 8px;
        outline: 0;
        border: 1px solid #444;
        font-size: 18px;
      }
      .input-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .btn-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 20px;
      }
      button {
        border-radius: 8px;
        padding: 16px 12px;
        border: 0;
        text-align: center;
        background-color: antiquewhite;
        cursor: pointer;
        width: 45%;
      }
      .stack-display {
        width: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 50%;
        border-bottom: 4px solid black;
        border-left: 1px solid black;
        border-right: 1px solid black;
        border-radius: 0 0 8px 8px;
      }
      .stack-item {
        width: 100%;
        background-color: #eee;
        border-radius: 8px;
        margin: 10px 0;
        text-align: center;
        padding: 20px;
        font-size: 28px;
        font-weight: 500;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div>
      <h3 class="title">Stack Data structure</h3>
      <div class="wrapper">
        <div class="input-wrapper">
          <input type="text" id="inputField" />
          <div class="btn-wrapper">
            <button type="button" onclick="addElement()">
              Add element to Stack
            </button>
            <button type="button" onclick="removeElement()">
              Remove element to Stack
            </button>
            <button type="button" onclick="displayElement()">
              Display All element to Stack
            </button>
            <button type="button" onclick="clearElement()">
              Clear All element from Stack
            </button>
          </div>
        </div>
        <div class="stack-display">
          <div class="stack"></div>
          <div class="stack-size">0</div> <!-- Updated the stack size display -->
        </div>
      </div>
    </div>
    <script>
      class Stack {
        constructor() {
          this.items = [];
        }
        // Add an element to the stack
        push(element) {
          this.items.push(element);
        }
        // Remove an element from the stack
        pop() {
          if (this.isEmpty()) {
            return "Stack is empty";
          }
          return this.items.pop();
        }
        // Peek at the top element of the stack
        peek() {
          if (this.isEmpty()) {
            return "Stack is empty";
          }
          return this.items[this.items.length - 1];
        }
        // Check if the stack is empty
        isEmpty() {
          return this.items.length === 0;
        }
        // Get the size of the stack
        size() {
          return this.items.length;
        }

        // Clear the stack
        clear() {
          this.items = [];
        }
        // Display all elements
        display() {
          return this.items;
        }
      }

      // Create an instance of the stack
      const stack = new Stack();

      function addElement() {
        let input = document.querySelector("#inputField").value;
        if (input.trim() === "") return; // Ignore empty input

        stack.push(input); // Use the stack instance here
        let stackDiv = document.querySelector('.stack');
        let stackItem = document.createElement('div');
        stackItem.classList.add('stack-item'); // Corrected the classList method
        stackItem.innerText = input;
        stackDiv.prepend(stackItem);
        
        // Clear the input field after adding
        document.querySelector("#inputField").value = "";
        updateStackSize(); // Update stack size display
      }

      function removeElement() {
        stack.pop(); // Use the stack instance here
        let stackDiv = document.querySelector('.stack');
        stackDiv.removeChild(stackDiv.firstElementChild); // Remove last stack item from DOM
        updateStackSize(); // Update stack size display
      }

      function displayElement() {
        console.log(stack.display());
      }

      function clearElement() {
        stack.clear(); // Clear the stack instance
        let stackDiv = document.querySelector('.stack');
        stackDiv.innerHTML = ""; // Clear all stack items from DOM
        updateStackSize(); // Update stack size display
      }

      function updateStackSize() {
        let stackSize = stack.size(); // Get current stack size
        document.querySelector('.stack-size').innerText = stackSize; // Update size display
      }
    </script>
  </body>
</html>
