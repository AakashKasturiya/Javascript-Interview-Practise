<body>
    <h1>how to find union of two arrays in javascript</h1>
    <p>The union of two or more sets is a set containing all unique elements from the given sets. It combines elements from both sets while removing duplicates.</p>
    <script>
        const arr1 = [1, 2, 6, 8, 17];
        const arr2 = [4, 8, 6, 19, 12, 17];

        let findUnion = [...new Set([...arr1,...arr2])];

        console.log(findUnion);

    </script>
</body>
