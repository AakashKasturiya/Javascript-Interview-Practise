<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merge Two array manually JS</title>
  </head>
  <body>
    <script>

      /* Merge Two array manually JS */

      function mergeArrays(arr1, arr2) {
        // Create a new array to hold the merged result
        let mergedArray = [];

        // Push elements from the first array into the merged array
        for (let i = 0; i < arr1.length; i++) {
          mergedArray.push(arr1[i]);
        }

        // Push elements from the second array into the merged array
        for (let i = 0; i < arr2.length; i++) {
          mergedArray.push(arr2[i]);
        }

        // Return the merged array
        return mergedArray;
      }

      // Example usage:
      let array1 = [1, 2, 3];
      let array2 = [4, 5, 6];

      let result = mergeArrays(array1, array2);
      console.log(result); // Output: [1, 2, 3, 4, 5, 6]
    </script>
  </body>
</html>
