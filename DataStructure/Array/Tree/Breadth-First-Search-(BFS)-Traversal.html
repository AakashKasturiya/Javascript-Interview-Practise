<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breadth-First Search (BFS) Traversal in Binary Search Tree (BST)</title>
</head>

<body>
    <h1>Breadth-First Search (BFS) Traversal in Binary Search Tree (BST)</h1>
    <script>
        // Node class to represent each node in the tree
        class Node {
            constructor(data) {
                this.data = data;
                this.left = null;
                this.right = null;
            }
        }

        // Binary Search Tree class
        class BinarySearchTree {
            constructor() {
                this.root = null;
            }

            // Insert method to add nodes to the tree
            insert(data) {
                const newNode = new Node(data);
                if (!this.root) {
                    this.root = newNode;
                } else {
                    this.insertNode(this.root, newNode);
                }
            }

            // Helper method to insert nodes in the correct position
            insertNode(node, newNode) {
                if (newNode.data < node.data) {
                    if (!node.left) {
                        node.left = newNode;
                    } else {
                        this.insertNode(node.left, newNode);
                    }
                } else {
                    if (!node.right) {
                        node.right = newNode;
                    } else {
                        this.insertNode(node.right, newNode);
                    }
                }
            }

            // BFS (Level-Order) Traversal
            bfs() {
                if (!this.root) return;

                const queue = [];  // Create a queue
                queue.push(this.root);  // Enqueue the root node

                while (queue.length > 0) {
                    // Dequeue a node from the queue
                    const node = queue.shift();
                    console.log(node.data);  // Visit (print) the node's data

                    // Enqueue the left child if it exists
                    if (node.left) queue.push(node.left);

                    // Enqueue the right child if it exists
                    if (node.right) queue.push(node.right);
                }
            }
        }

        // Example Usage
        const bst = new BinarySearchTree();
        bst.insert(10);
        bst.insert(5);
        bst.insert(20);
        bst.insert(3);
        bst.insert(8);
        bst.insert(25);

        // BFS Traversal
        console.log("BFS (Level-Order) Traversal:");
        bst.bfs();  // Output: 10, 5, 20, 3, 8, 25

    </script>
</body>

</html>
