    <h1>JavaScript Code for Deleting a Node in BST:</h1>
    <script>
        // Node class to represent each node in the tree
        class Node {
            constructor(data) {
                this.data = data;
                this.left = null;
                this.right = null;
            }
        }

        // Binary Search Tree class
        class BinarySearchTree {
            constructor() {
                this.root = null;
            }

            // Insert method to add nodes to the tree
            insert(data) {
                const newNode = new Node(data);
                if (!this.root) {
                    this.root = newNode;
                } else {
                    this.insertNode(this.root, newNode);
                }
            }

            // Helper method to insert nodes in the correct position
            insertNode(node, newNode) {
                if (newNode.data < node.data) {
                    if (!node.left) {
                        node.left = newNode;
                    } else {
                        this.insertNode(node.left, newNode);
                    }
                } else {
                    if (!node.right) {
                        node.right = newNode;
                    } else {
                        this.insertNode(node.right, newNode);
                    }
                }
            }

            // Helper function to find the minimum value node (used in deletion)
            findMinNode(node) {
                while (node && node.left) {
                    node = node.left;
                }
                return node;
            }

            // Delete a node in the BST
            deleteNode(root, key) {
                // Base Case: If the tree is empty
                if (!root) {
                    return root;
                }

                // Recursively find the node to delete
                if (key < root.data) {
                    root.left = this.deleteNode(root.left, key);
                } else if (key > root.data) {
                    root.right = this.deleteNode(root.right, key);
                } else {
                    // Node to be deleted found
                    // Case 1: Node has no children (leaf node)
                    if (!root.left && !root.right) {
                        return null;
                    }

                    // Case 2: Node has one child
                    if (!root.left) {
                        return root.right;
                    } else if (!root.right) {
                        return root.left;
                    }

                    // Case 3: Node has two children
                    // Find the in-order successor (the smallest node in the right subtree)
                    const minNode = this.findMinNode(root.right);

                    // Replace the node's value with the in-order successor's value
                    root.data = minNode.data;

                    // Delete the in-order successor
                    root.right = this.deleteNode(root.right, minNode.data);
                }
                return root;
            }

            // Public method to delete a node (wrapper)
            delete(key) {
                this.root = this.deleteNode(this.root, key);
            }

            // In-order Traversal (for testing purposes)
            inOrderTraversal(node = this.root) {
                if (node) {
                    this.inOrderTraversal(node.left);
                    console.log(node.data);
                    this.inOrderTraversal(node.right);
                }
            }
        }

        // Example Usage
        const bst = new BinarySearchTree();
        bst.insert(50);
        bst.insert(30);
        bst.insert(20);
        bst.insert(40);
        bst.insert(70);
        bst.insert(60);
        bst.insert(80);

        // Initial In-order Traversal
        console.log("In-order before deletion:");
        bst.inOrderTraversal();  // Output: 20, 30, 40, 50, 60, 70, 80
