<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree</title>
</head>
<body>
    <script>
        // Define a Node class
        class Node {
            constructor(data) {
                this.data = data;
                this.left = null;
                this.right = null;
            }
        }

        // Define a Binary Tree class
        class BinaryTree {
            constructor() {
                this.root = null;
            }

            // Insert method for Binary Search Tree (BST)
            insert(data) {
                const newNode = new Node(data);
                if (!this.root) {
                    this.root = newNode;
                } else {
                    this.insertNode(this.root, newNode);
                }
            }

            insertNode(node, newNode) {
                if (newNode.data < node.data) {
                    if (!node.left) {
                        node.left = newNode;
                    } else {
                        this.insertNode(node.left, newNode);
                    }
                } else {
                    if (!node.right) {
                        node.right = newNode;
                    } else {
                        this.insertNode(node.right, newNode);
                    }
                }
            }

            // In-order traversal (for BST)
            inOrderTraversal(node = this.root) {
                if (node) {
                    this.inOrderTraversal(node.left);
                    console.log(node.data);
                    this.inOrderTraversal(node.right);
                }
            }
        }

        // Example Usage
        const tree = new BinaryTree();
        tree.insert(10);
        tree.insert(5);
        tree.insert(20);
        tree.insert(8);

        tree.inOrderTraversal();  // Output: 5, 8, 10, 20

    </script>
</body>

</html>
