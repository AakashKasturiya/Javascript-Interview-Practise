<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Code to Find Minimum and Maximum Values in a BST:</title>
</head>

<body>
    <h1>JavaScript Code to Find Minimum and Maximum Values in a BST:</h1>
    <script>
        // Node class to represent each node in the tree
        class Node {
            constructor(data) {
                this.data = data;
                this.left = null;
                this.right = null;
            }
        }

        // Binary Search Tree class
        class BinarySearchTree {
            constructor() {
                this.root = null;
            }

            // Insert method to add nodes to the tree
            insert(data) {
                const newNode = new Node(data);
                if (!this.root) {
                    this.root = newNode;
                } else {
                    this.insertNode(this.root, newNode);
                }
            }

            // Helper method to insert nodes in the correct position
            insertNode(node, newNode) {
                if (newNode.data < node.data) {
                    if (!node.left) {
                        node.left = newNode;
                    } else {
                        this.insertNode(node.left, newNode);
                    }
                } else {
                    if (!node.right) {
                        node.right = newNode;
                    } else {
                        this.insertNode(node.right, newNode);
                    }
                }
            }

            // Find the minimum value in the BST
            findMin(node = this.root) {
                // Keep going left until the leftmost node is found
                while (node && node.left) {
                    node = node.left;
                }
                return node ? node.data : null;
            }

            // Find the maximum value in the BST
            findMax(node = this.root) {
                // Keep going right until the rightmost node is found
                while (node && node.right) {
                    node = node.right;
                }
                return node ? node.data : null;
            }
        }

        // Example Usage
        const bst = new BinarySearchTree();
        bst.insert(10);
        bst.insert(5);
        bst.insert(20);
        bst.insert(3);
        bst.insert(8);
        bst.insert(25);

        // Find Minimum Value
        console.log("Minimum Value:", bst.findMin());  // Output: 3

        // Find Maximum Value
        console.log("Maximum Value:", bst.findMax());  // Output: 25

    </script>
</body>

</html>
