<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Data Structure in JavaScript</title>
  <script>
    // Create a Set
    let numbers = new Set([1, 2, 3, 4, 5]);

    // Add a new element
    numbers.add(6);

    // Trying to add a duplicate element (will not be added)
    numbers.add(4);

    // Get the size of the Set
    console.log('Size of Set:', numbers.size); // 6 (duplicate 4 is ignored)

    // Check if an element exists in the Set
    console.log('Has 3:', numbers.has(3)); // true
    console.log('Has 10:', numbers.has(10)); // false

    // Delete an element from the Set
    numbers.delete(4); // Removes the value 4
    console.log('After deleting 4:', [...numbers]); // [1, 2, 3, 5, 6]

    // Iterate through the Set
    console.log('Using forEach:');
    numbers.forEach(value => {
      console.log(value); // Logs each element: 1, 2, 3, 5, 6
    });

    // Clear all elements from the Set
    numbers.clear();
    console.log('After clear:', [...numbers]); // []
  </script>
</head>
<body>
  <h1>Set Data Structure in JavaScript</h1>
</body>
</html>
